services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    container_name: abhishek-portfolio
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      - NODE_ENV=production

